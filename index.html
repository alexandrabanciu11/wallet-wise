
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <title>WalletWise - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

    <div class="login-container">
        <h1>WalletWise</h1>
        <p class="tagline">Manage your money, one day at a time.</p>

        <h2>Welcome back</h2>
        <p>Log in to manage your money.</p>

        <form id="loginForm">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>
            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
                <button
                    type="button"
                    class="toggle-password"
                    aria-label="Show password"
                    aria-pressed="false"
                    onclick="togglePasswordVisibility('password', this)"
                >👁</button>
            </div>

            <a href="reset-password.html" id="forgot-password">
                Forgot password?
            </a>

            <button type="submit">Log In</button>
        </form>

        <p class="signup">
            Don't have an account? <a href="signup.html">Sign up</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="language.js"></script>
    <script src="script.js"></script>
</body>
</html>
