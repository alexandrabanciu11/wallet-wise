<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletWise</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>WalletWise</h1>
    <button id="lang-toggle">RO</button>
    <h2>Balance: <span id="balance">0</span></h2>
    <form id="purchase-form">
        <label for="store-name">Store</label>
        <input type="text" id="store-name">

        <label for="purchase-date">Date</label>
        <input type="date" id="purchase-date">

        <label for="item-name">Item</label>
        <input type="text" id="item-name">

        <label for="item-price">Price</label>
        <input type="number" id="item-price" step="0.01">

        <label for="item-category">Category</label>
        <select id="item-category">
            <option value="food">Food</option>
            <option value="transport">Transport</option>
            <option value="entertainment">Entertainment</option>
            <option value="other">Other</option>
        </select>

        <button type="submit">Add Purchase</button>    
    </form>
    
    <div id="purchase-list"></div>

    <div id="streaks-section"></div>
    <div id="wishlist-section"></div>
    <div id="recap-section"></div>

    <script src="js/app.js" defer></script>
</body>
</html>
