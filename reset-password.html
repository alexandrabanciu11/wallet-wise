
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | WalletWise</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="reset-container">
        <h1>Reset your password</h1>
        <p>Enter your email to receive a password reset link.</p>

        <form id="resetEmailForm">
            <label for="resetEmail">Email address</label>
            <input
                type="email"
                id="resetEmail"
                required
                autocomplete="email"
                placeholder="Enter your email"
            >
            <button type="submit">Send reset link</button>
        </form>

        <form id="newPasswordForm" hidden>
            <label for="newPassword">New password</label>

            <div class="password-input-wrapper">
                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    required
                    minlength="6"
                    autocomplete="new-password"
                    placeholder="Enter a new password"
                >

                <button
                    type="button"
                    class="toggle-password"
                    aria-label="Show password"
                    aria-pressed="false"
                    onclick="togglePasswordVisibility('newPassword', this)"
                >👁</button>
            </div>

            <button type="submit">Update password</button>
        </form>

        <p id="resetMessage" role="status"></p>

        <a href="index.html" class="back-to-login">Back to login</a>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>

    <script>
        const client = window.supabaseClient;
        const emailForm = document.getElementById("resetEmailForm");
        const passwordForm = document.getElementById("newPasswordForm");
        const message = document.getElementById("resetMessage");

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";
            button.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
            button.setAttribute("aria-pressed", String(isHidden));
        }

        emailForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("resetEmail").value.trim();
            message.textContent = "Sending reset link...";

            const { error } = await client.auth.resetPasswordForEmail(email, {
                redirectTo:
                    "https://alexandrabanciu11.github.io/wallet-wise/reset-password.html"
            });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent =
                "If an account exists for that email, a reset link will be sent.";
        });

        passwordForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            message.textContent = "Updating password...";

            const { error } = await client.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = error.message;
                return;
            }

            await client.auth.signOut();

            message.textContent =
                "Password updated successfully! You can now log in.";

            passwordForm.hidden = true;
            emailForm.hidden = true;
        });

        client.auth.onAuthStateChange((event) => {
            if (event === "PASSWORD_RECOVERY") {
                emailForm.hidden = true;
                passwordForm.hidden = false;
                message.textContent = "Choose your new password.";
            }
        });

        // Handle a recovery link when the page first loads.
        client.auth.getSession().then(({ data }) => {
            if (data.session && window.location.hash.includes("type=recovery")) {
                emailForm.hidden = true;
                passwordForm.hidden = false;
                message.textContent = "Choose your new password.";
            }
        });
    </script>
</body>
</html>
